{% extends 'adoption/base.html' %}

{% block title %}Report Lost Pet{% endblock %}

{% block content %}

<h1>Report a Lost Pet</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        Submit Lost Pet
    </button>
</form>


{% endblock %}
