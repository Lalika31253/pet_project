{% extends 'adoption/base.html' %}

{% block title %}Report Lost Pet{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto p-6 bg-base-100 rounded-3xl shadow-md border border-base-200 space-y-6">

    <!-- TITLE -->
    <h1 class="text-3xl font-bold">Report a Lost Pet</h1>

    <!-- FORM -->
    <form method="POST" enctype="multipart/form-data" class="space-y-4">

        {% csrf_token %}

        <!-- FORM FIELDS -->
        <div class="space-y-3">
            {{ form.as_p }}
        </div>

        <hr class="border-base-200">

        <!-- IMAGES -->
        <div class="space-y-3">

            <h3 class="text-xl font-bold">Images</h3>

            {{ formset.management_form }}

            {% for f in formset %}
                <div class="p-3 bg-base-200 rounded-xl space-y-2">

                    {{ f.image }}

                    {% if f.instance.pk %}
                        <img
                            src="{{ f.instance.image.url }}"
                            class="w-28 h-28 object-cover rounded-lg shadow-sm"
                        >

                        <label class="flex items-center gap-2 text-sm mt-2">
                            {{ f.DELETE }}
                            <span>Delete image</span>
                        </label>
                    {% endif %}

                </div>
            {% endfor %}

        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn btn-primary w-full rounded-2xl">
            Save
        </button>

    </form>

</div>

{% endblock %}
