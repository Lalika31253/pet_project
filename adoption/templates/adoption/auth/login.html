{% extends 'adoption/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="flex items-center justify-center min-h-[70vh]">

  <div class="w-full max-w-md bg-base-100 shadow-xl rounded-2xl p-8">

    <h1 class="text-2xl font-bold text-center mb-6">
      Welcome Back
    </h1>

    {% if form.errors %}
      <div class="alert alert-error mb-4">
        Username or password is incorrect. Please try again.
      </div>
    {% endif %}

    <form method="post" hx-post="{% url 'login' %}" hx-target="body" class="space-y-4">

      {% csrf_token %}

      <!-- Username / Email -->
      <div>
        <label class="label">
          <span class="label-text">Email / Username</span>
        </label>
        <input
          type="text"
          name="username"
          placeholder="Enter your email or username"
          class="input input-bordered w-full"
          required
        >
      </div>

      <!-- Password -->
      <div>
        <label class="label">
          <span class="label-text">Password</span>
        </label>
        <input
          type="password"
          name="password"
          placeholder="Enter your password"
          class="input input-bordered w-full"
          required
        >
      </div>

      <!-- Submit -->
      <button class="btn btn-primary w-full mt-2">
        Login
      </button>

    </form>

    <p class="text-center text-sm mt-5">
      Don't have an account?
      <a href="{% url 'register' %}" class="link link-primary">
        Register here
      </a>
    </p>

  </div>

</div>

{% endblock %}
