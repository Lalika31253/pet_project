<!DOCTYPE html>
<html lang="en" data-theme="retro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Pet Project{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
      rel="stylesheet"
    />

    <style>
      input.no-native-clear::-webkit-search-cancel-button {
        display: none !important;
        -webkit-appearance: none !important;
      }

      input.no-native-clear::-ms-clear {
        display: none !important;
      }

      input[type="search"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>

  <body
    class="bg-base-200 text-base-content min-h-screen flex flex-col"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
  >

    <!-- NAVBAR -->
    <div class="navbar bg-base-100 shadow-md sticky top-0 z-50 px-4">

      <!-- LEFT -->
      <div class="flex-1">
        <a href="{% url 'landing' %}" class="btn btn-ghost text-xl font-bold">
          🐾 PetFinder
        </a>
      </div>

      <!-- CENTER LINKS -->
      <div class="hidden lg:flex gap-2">
        <a class="btn btn-ghost btn-sm" href="{% url 'about' %}">About</a>
        <a class="btn btn-ghost btn-sm" href="{% url 'help' %}">Help Animals</a>
        <a class="btn btn-ghost btn-sm" href="{% url 'pet-list' %}">Adoption</a>
        <a class="btn btn-ghost btn-sm" href="{% url 'lost-pets' %}">Lost & Found</a>
      </div>

      <!-- RIGHT -->
      <div class="flex items-center gap-3">

        {% if user.is_authenticated %}

          <a href="{% url 'profile' %}" class="btn btn-sm btn-primary rounded-full">
            Profile
          </a>

          <div class="dropdown dropdown-end">
            <label tabindex="0" class="btn btn-ghost btn-circle avatar">
              <div class="w-10 rounded-full bg-primary text-white flex items-center justify-center">
                👤
              </div>
            </label>

            <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
              <li class="px-3 py-2 text-sm opacity-70">
                {{ user.username }}
              </li>
              <li>
                <form method="POST" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="text-left w-full">
                    Logout
                  </button>
                </form>
              </li>
            </ul>
          </div>

        {% else %}

          <a href="{% url 'login' %}" class="btn btn-sm btn-outline">
            Login
          </a>

        {% endif %}

      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
      {% block content %}{% endblock %}
    </main>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  </body>
</html>
