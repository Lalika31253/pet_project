{% extends 'adoption/base.html' %}

{% block title %}Lost Pets{% endblock %}

{% block content %}

<h1>Pets</h1>

<input
  type="search"
  name="q"
  placeholder="Search pets..."
  hx-get="/api/pets/search/"
  hx-trigger="keyup changed delay:300ms"
  hx-target="#pet-results"
  hx-swap="innerHTML"
/>

<div id="pet-results">
  {% include 'adoption/partials/lost_pet_table.html' %}
</div>

{% endblock %}
