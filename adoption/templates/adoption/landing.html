{% extends 'adoption/base.html' %}

{% block title %}Landing{% endblock %}

{% block content %}



    <!-- SINGLE TIGHT CONTAINER -->
    <div class="max-w-6xl mx-auto px-6 pt-4 pb-6 space-y-3">

        <!-- TITLE -->
        <div class="text-center space-y-1">

            <h1 class="text-5xl font-bold leading-tight">
                Find Pets Across Canada 🐾
            </h1>

            <p class="text-base-content/60 text-base">
                Click on a province to explore pets near you.
            </p>

        </div>

        <!-- MAP CARD (now directly under title) -->
        <div class="bg-base-200/50 border border-base-300 rounded-3xl shadow-lg p-4">

            <!-- TOOLTIP -->
            <div id="tooltip"
                 class="absolute hidden bg-black text-white px-3 py-1 rounded-lg text-sm pointer-events-none z-50">
            </div>

            <!-- MAP -->
            <div class="map-wrapper flex justify-center">
                {% include 'images/canada_map.svg' %}
            </div>

        </div>

    </div>



<script>

function goToProvince(province) {
    window.location.href = `/pets/province/${province}/`;
}

const tooltip = document.getElementById('tooltip');
const provinces = document.querySelectorAll('.province');

provinces.forEach(province => {

    province.addEventListener('mousemove', (e) => {
        tooltip.style.display = 'block';

        tooltip.innerHTML =
            province.id.charAt(0).toUpperCase() +
            province.id.slice(1);

        tooltip.style.left = e.pageX + 15 + 'px';
        tooltip.style.top = e.pageY + 15 + 'px';
    });

    province.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
    });

});

</script>

<style>

.map-wrapper svg {
    width: 100%;
    max-width: 950px;
    height: auto;
}

.province {
    fill: #cbd5e1;
    stroke: white;
    stroke-width: 1.2;
    cursor: pointer;
    transition: all 0.2s ease;
}

.province:hover {
    fill: #facc15;
    transform: scale(1.01);
}

#tooltip {
    position: absolute;
    display: none;
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 9999;
}

</style>

{% endblock %}
